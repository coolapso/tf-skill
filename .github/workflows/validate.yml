name: Validate Skill

on:
  # No `paths:` filter on pull_request: `Validate Skill Files` is a required
  # status check on master (ruleset), so it MUST run on EVERY PR - otherwise a
  # PR that touches no filtered path (e.g. README-only) never reports the check
  # and stays blocked forever. Same rule as pr-title-lint.yml. Validation steps
  # read files that always exist, so docs-only PRs pass cleanly. The release
  # workflow calls this workflow for merged commits before semrel runs.
  pull_request:
  workflow_call:
  workflow_dispatch:

# The commit linter only reads repository history. Keep the token read-only on
# PRs, including PRs from forks; review comments are deliberately disabled.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # convcommitlint compares the PR commit range with master.
          fetch-depth: 0

      - name: Lint Conventional Commits
        uses: coolapso/convcommitlint@v0.3.2
        with:
          base-branch: master
          create-review: "false"
          fetch-depth: 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Agent Skills specification
        uses: coolapso/agent-skills-validator@v0.1.0
        with:
          path: skills/terraform-skill

      - name: Validate repository skill links
        run: scripts/validate_skill_links.sh skills/terraform-skill

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            skills/**/*.md
            README.md
            CONTRIBUTING.md
        continue-on-error: true

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "All skill validation checks passed." >> $GITHUB_STEP_SUMMARY
