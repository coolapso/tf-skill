name: Semrel Release

# Semrel is the complete release path: it calculates the conventional-commit
# bump, creates the tag, and publishes the GitHub Release from master.

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    name: Validate Skill Files
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Tag and publish
    needs: validate
    concurrency:
      group: semrel-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'

      - name: Install semrel and GitHub provider
        run: |
          go install github.com/SemRels/semrel/cmd/semrel@v0.26.2
          semrel plugin install @semrel/provider-github@0.5.3

      - name: Validate semrel configuration
        run: semrel config validate

      - name: Tag and publish with semrel
        id: semrel
        run: semrel release --github-output
        env:
          SEMREL_PLUGIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
